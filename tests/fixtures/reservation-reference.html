<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reservation reference — synthetic local design</title>
<style>
body { margin: 0; padding: 24px; background: #eef2f7; color: #142238; font: 18px/1.5 system-ui; }
main { max-width: 560px; margin: 40px auto; padding: 24px; border-radius: 16px; background: white; }
h1 { line-height: 1.2; }
button { padding: 12px 20px; border: 0; border-radius: 8px; background: #2055c9; color: white; font: inherit; }
output { display: block; margin-top: 20px; }
</style>
<main>
  <h1>Evening concert</h1>
  <p>One ticket · 20 credits</p>
  <button disabled>Reserved</button>
  <output>Reservation confirmed: 1 ticket</output>
</main>
</html>
